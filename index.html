<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131712" media="(prefers-color-scheme: dark)">
<title>蘸酱饭桌</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蘸酱饭桌">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  --bg:#F1F4EC; --surface:#FBFCF8; --sunk:#E5EADE; --ink:#1E2620; --muted:#5C685E; --line:#D5DCCD;
  --accent:#5B3A6E; --accent-soft:#EAE1F0; --on-accent:#FFFFFF;
  --g:#2E7A4C; --g-soft:#DDEEDF; --y:#9A6412; --y-soft:#F5E8CF; --r:#A8412C; --r-soft:#F6DDD5;
  --scrim:rgb(20 26 20 / .38); --bar:rgb(251 252 248 / .92);
  --display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131712; --surface:#1C2119; --sunk:#252C22; --ink:#E4EAE0; --muted:#9BA696; --line:#303A2D;
    --accent:#C3A2D6; --accent-soft:#35293D; --on-accent:#1B1420;
    --g:#74C394; --g-soft:#1F3326; --y:#E3AE55; --y-soft:#3A2E17; --r:#EC8870; --r-soft:#3D231C;
    --scrim:rgb(0 0 0 / .55); --bar:rgb(28 33 25 / .92);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131712; --surface:#1C2119; --sunk:#252C22; --ink:#E4EAE0; --muted:#9BA696; --line:#303A2D;
  --accent:#C3A2D6; --accent-soft:#35293D; --on-accent:#1B1420;
  --g:#74C394; --g-soft:#1F3326; --y:#E3AE55; --y-soft:#3A2E17; --r:#EC8870; --r-soft:#3D231C;
  --scrim:rgb(0 0 0 / .55); --bar:rgb(28 33 25 / .92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.view>*{min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
.vhead h1{font-size:30px;line-height:1.2}
.sub{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}

/* 胶囊与圆点 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:600}
.t-w{background:var(--accent-soft);color:var(--accent)}.t-p{background:var(--sunk);color:var(--ink)}
.t-g{background:var(--g-soft);color:var(--g)}.t-y{background:var(--y-soft);color:var(--y)}.t-r{background:var(--r-soft);color:var(--r)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}

/* 分段控件 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{min-height:36px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.badge{font-size:11px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:700;line-height:18px}

/* 今天 */
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.daynav button{width:44px;height:44px;border-radius:22px;font-size:22px;color:var(--muted)}
.daynav button:active{background:var(--sunk)}
.daynav .when{text-align:center;display:flex;flex-direction:column;line-height:1.3}
.daynav .when strong{font-size:15px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.hero .dish{font-size:34px;line-height:1.2}
.hero .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;padding:4px 11px;border-radius:999px;background:var(--sunk)}
.tag.miss{background:var(--r-soft);color:var(--r);font-weight:600}
.tag.opt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.more{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:15px}
.swipehint{font-size:12px;color:var(--muted);text-align:center}
.rowlink{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;text-align:left;width:100%}
.rowlink .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:16px}
.rowlink .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.rowlink .tx strong{font-size:15px}
.rowlink .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink .chev{color:var(--muted);font-size:18px}
.ic.buy{background:var(--accent-soft);color:var(--accent)}
.ic.thaw{background:var(--sunk)}
.snack{display:flex;flex-direction:column;gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.scroller .tag{white-space:nowrap;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line)}

/* 冰箱 */
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:19px;display:flex;align-items:baseline;gap:8px}
.group h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 15px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .q{font-size:12px;opacity:.8}
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));padding:10px 16px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.cta button{pointer-events:auto;width:100%;max-width:528px;min-height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card>*{min-width:0}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:2px 10px;padding-block:9px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0;padding-top:2px}
.plan .k{font-size:12px;color:var(--accent);font-weight:700;padding-top:3px}
.plan .u{grid-column:2;font-size:13px;color:var(--muted)}
.plan button{text-align:left;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.verdict{font-size:14px;border-radius:10px;padding:10px 12px}
.verdict.ok{background:var(--g-soft);color:var(--g)}
.verdict.left{background:var(--y-soft);color:var(--y)}
.adjust{font-size:14px;color:var(--accent);font-weight:600;min-height:40px;align-self:flex-start}
.steps{display:flex;flex-direction:column}
.steps .st{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px;border-top:1px solid var(--line)}
.steps .st:first-child{border-top:0}
.steps .ctl{display:flex;align-items:center;gap:4px}
.steps .ctl button{width:40px;height:40px;border-radius:20px;background:var(--sunk);font-size:20px}
.steps output{min-width:44px;text-align:center;font-weight:600}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;min-height:56px;border-top:1px solid var(--line)}
.list button:first-child{border-top:0}
.list button:active{background:var(--sunk)}
.list .tx{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.list .tx strong{font-size:16px;font-weight:600}
.list .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .tx span.warn{color:var(--r)}
.list .chev{color:var(--muted)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sechead h2{font-size:20px}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* 月菜单 */
.daylist .d{font-size:13px;color:var(--muted);width:40px;line-height:1.3}
.daylist .d.today{color:var(--accent);font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks label{display:flex;gap:12px;align-items:center;min-height:44px;border-top:1px solid var(--line)}
.checks li:first-child label{border-top:0}
.checks input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.field input{font:inherit;color:var(--ink);background:var(--sunk);border:0;border-radius:8px;padding:6px 10px}
.btn-quiet{font-size:14px;color:var(--accent);font-weight:600;min-height:36px}

/* 底部标签栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabbar)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}

/* 底部弹出面板 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);box-shadow:0 -8px 30px rgb(0 0 0 / .2)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 20px 8px;flex:none}
.sheet .sh h2{font-size:26px;line-height:1.25}
.sheet .x{width:36px;height:36px;border-radius:18px;background:var(--sunk);font-size:18px;flex:none;color:var(--muted)}
.sheet .sb{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet .sb>*{min-width:0}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
body.sheet-open{overflow:hidden}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-top:1px solid var(--line);font-size:15px}
.ing li:first-child{border-top:0}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
.ing li.miss span:first-child{color:var(--r);font-weight:600}
.how{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
/* 图标 */
.ico{display:inline-grid;place-items:center;width:var(--s);height:var(--s);font-size:calc(var(--s)*.74);line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--body)}
.ico.b{font-family:var(--body);font-size:calc(var(--s)*.3);font-weight:700;background:var(--y-soft);color:var(--y);border-radius:28%;letter-spacing:-.03em}
.ico.miss{opacity:.35;filter:grayscale(1);outline:2px solid var(--r);outline-offset:-1px;border-radius:50%}
.icons{display:inline-flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden}

/* 三分格餐盘 */
.plate{position:relative;width:var(--p);height:var(--p);max-width:100%;flex:none}
.plate.t-g,.plate.t-y,.plate.t-r{background:none}
.pl-svg{position:absolute;inset:0;width:100%;height:100%}
.pl-rim{fill:var(--surface);stroke:var(--line);stroke-width:2}
.pl-well{fill:var(--sunk)}
.pl-div line{stroke:var(--surface);stroke-width:6;stroke-linecap:round}
.pl-hub{fill:var(--surface)}
.plate.t-g .pl-hub{fill:var(--g-soft)}.plate.t-y .pl-hub{fill:var(--y-soft)}.plate.t-r .pl-hub{fill:var(--r-soft)}
.pl-i{position:absolute;display:grid;place-items:center}
.pl-i.opt{opacity:.55}
.pl-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1}
.pl-empty{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:var(--muted);white-space:nowrap;opacity:.8}
.hero-plate{display:flex;justify-content:center}
.hero-txt{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sheet-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sheet-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ing-n{display:inline-flex;align-items:center;gap:8px;min-width:0}

/* 做法流程 */
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:f}
.flow li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;padding-block:7px;border-top:1px dashed var(--line)}
.flow li:first-child{border-top:0}
.flow li::before{counter-increment:f;content:counter(f);width:24px;height:24px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:16px;font-weight:500}
.yes{white-space:nowrap;color:var(--g);font-weight:700;background:var(--g-soft);padding:0 7px;border-radius:6px}
.no{white-space:nowrap;color:var(--r);font-weight:700;background:var(--r-soft);padding:0 7px;border-radius:6px;text-decoration:line-through;text-decoration-thickness:1.5px}
.arr{color:var(--muted)}

/* 加餐 */
.formula{display:flex;align-items:center;gap:8px}
.plus{font-size:22px;color:var(--muted)}
.snk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 8px;font-size:14px}

/* 冰箱格子 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:82px;padding:8px 4px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.tile .tn{font-size:13px;line-height:1.2;text-align:center}
.tile[aria-pressed="false"] .ico{opacity:.45;filter:grayscale(.6)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;right:7px;font-size:12px;font-weight:700;color:var(--accent)}
.svd{font-size:8px;letter-spacing:1px;color:var(--accent);line-height:1}

/* 吃完矩阵 */
.matrix{display:grid;grid-template-columns:36px repeat(var(--cols),minmax(0,1fr)) 36px;gap:4px;align-items:center}
.mx-h{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;min-height:36px;justify-content:center;border-radius:8px}
button.mx-h:active{background:var(--sunk)}
.mx-r{display:grid;place-items:center}
.mx-c{height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700}
.mx-on{width:16px;height:16px;border-radius:50%;background:var(--accent)}
.mx-left{background:var(--y-soft);color:var(--y)}
.mx-zero{background:var(--g-soft);color:var(--g)}
.plan .u{display:flex;gap:2px}
.mini{display:inline-flex;align-items:center;gap:0;padding:4px 6px;border-radius:12px;background:var(--sunk)}
.mini.t-g{background:var(--g-soft)}.mini.t-y{background:var(--y-soft)}.mini.t-r{background:var(--r-soft)}

/* 日历 */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.bdot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-w{text-align:center;font-size:12px;color:var(--muted)}
.cal-d{position:relative;aspect-ratio:1/1.12;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent}
.cal-d.t-g{background:var(--g-soft)}.cal-d.t-y{background:var(--y-soft)}.cal-d.t-r{background:var(--r-soft)}
.cal-d.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-n{position:absolute;top:3px;left:5px;font-size:10px;color:var(--muted);font-weight:600}
.cal-d .bdot{position:absolute;top:5px;right:5px}
.cal-d:active{transform:scale(.96)}
details.adj summary{list-style:none;cursor:pointer}
details.adj summary::-webkit-details-marker{display:none}

/* 图例 */
.toplink{font-size:15px;color:var(--accent);font-weight:600;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.lg-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.lg-card:active{transform:scale(.97)}
.lg-card strong{font-size:14px;font-weight:600}
.lg-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.lg-k,.lg-s{font-size:11px;padding:0 6px;border-radius:6px;line-height:18px}
.lg-fresh{background:var(--r-soft);color:var(--r)}.lg-keep{background:var(--g-soft);color:var(--g)}.lg-frozen{background:var(--y-soft);color:var(--y)}
.lg-s{background:var(--sunk);color:var(--muted)}
.lg-n{font-size:11px;color:var(--muted)}
.lg-plate{flex-direction:row;align-items:center;flex-wrap:wrap}
.lg-plate-tx{display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1;min-width:150px}
.lg-dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.lg-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.lg-row:nth-child(2){border-top:0}
.lg-g{display:flex;align-items:center;justify-content:center;gap:4px;font-size:22px}
.lg-g .yes,.lg-g .no{font-size:14px;white-space:nowrap}
.lg-t{display:flex;flex-direction:column;line-height:1.35}
.lg-t strong{font-size:15px}.lg-t span{font-size:13px;color:var(--muted)}
.lg-mx{width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.lg-cal{display:flex;gap:3px}.lg-cal span{width:16px;height:18px;border-radius:5px;display:block}
.lg-cal .t-g{background:var(--g-soft)}.lg-cal .t-y{background:var(--y-soft)}.lg-cal .t-r{background:var(--r-soft)}

.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding-top:4px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;letter-spacing:.04em}
.brandmark{width:28px;height:28px;border-radius:7px;flex:none;vertical-align:middle}
.vhead h1{display:inline-flex;align-items:center;gap:10px}
.vhead h1 .brandmark{width:30px;height:30px}
.back-today{min-height:36px;padding:0 14px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;box-shadow:0 2px 8px rgb(0 0 0 / .15)}

@media (prefers-reduced-motion:no-preference){
  .sheet{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .scrim{transition:opacity .2s}
  .hero{transition:transform .2s,opacity .2s}
}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}

function ico(id,s=28,extra=''){
  const v=ICON[id]||'?';
  return v==='@'
    ?`<span class="ico svg ${extra}" style="--s:${s}px" aria-hidden="true"><svg viewBox="0 0 32 32" width="100%" height="100%">${SVGI[id]}</svg></span>`
    :`<span class="ico ${extra}" style="--s:${s}px" aria-hidden="true">${v}</span>`;
}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextMonday(){const t=new Date();t.setHours(0,0,0,0);const w=t.getDay();t.setDate(t.getDate()+(w===1?0:(8-w)%7));return iso(t)}
let S={start:nextMonday(),have:DEFAULT_HAVE,qty:{},hideFire:false,checks:{},fview:'have',mview:'cal'};

const has=id=>S.have.includes(id);
const qtyOf=id=>S.qty[id]??I[id].serv;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 匹配 ---------- */
function resolve(dish){
  const rows=[],missing=[],fresh=[];
  for(const [key,q] of dish.need){
    const ids=key.split('|');const got=ids.find(has);
    if(got){rows.push({id:got,n:I[got].n,q,ok:true});if(I[got].c==='fresh')fresh.push(got)}
    else{const n=ids.map(k=>I[k].n).join(' 或 ');rows.push({id:ids[0],n,q,ok:false});missing.push({id:ids[0],n})}
  }
  for(const [key,q] of (dish.opt||[])){
    rows.push({id:key,n:I[key].n,q,ok:true,opt:true});
    if(has(key)&&I[key].c==='fresh')fresh.push(key);
  }
  return {rows,missing,fresh:[...new Set(fresh)]};
}
const dayDish=n=>DISH.find(x=>x.d===n);
const WD=['周日','周一','周二','周三','周四','周五','周六'];
function dayInfo(off){
  const start=new Date(S.start+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+off);
  const idx=Math.round((t-start)/864e5);const before=idx<0;const i=before?0:idx;
  return {date:t,before,daysTo:-idx,n:(i%28)+1,cycle:Math.floor(i/28)+1};
}

/* 餐盘：上半 = 菜（½），右下 = 肉蛋豆（¼），左下 = 饭（¼） */
const SLOTS_HALF={1:[[0,.56]],2:[[-32,.6],[32,.6]],3:[[-48,.62],[0,.62],[48,.62]],4:[[-54,.64],[-18,.66],[18,.66],[54,.64]],
 5:[[-56,.68],[-19,.7],[19,.7],[56,.68],[0,.38]],6:[[-58,.68],[-20,.7],[20,.7],[58,.68],[-32,.4],[32,.4]]};
const SLOTS_QTR={1:[[0,.56]],2:[[-21,.6],[21,.6]],3:[[-25,.68],[25,.68],[0,.4]],4:[[-26,.7],[26,.7],[-20,.42],[20,.42]]};
const SEC_DEF=[{k:'veg',a:-90,n:'菜',slots:SLOTS_HALF,max:6},{k:'pro',a:45,n:'肉蛋豆',slots:SLOTS_QTR,max:4},{k:'carb',a:135,n:'饭',slots:SLOTS_QTR,max:4}];
const secOf=id=>SEC_DEF.find(s=>SECT[s.k].includes(id)).k;
function plate(dish,size,demo=false){
  const r=demo?{rows:dish.need.map(([id])=>({id,n:I[id].n,ok:true}))}:resolve(dish);const R=size/2;
  const isz=Math.round(size*0.14);
  const pt=(deg,rf)=>{const a=deg*Math.PI/180;return [R+Math.cos(a)*R*rf,R+Math.sin(a)*R*rf]};
  const divs=[0,90,180].map(d=>{const [x1,y1]=pt(d,.15),[x2,y2]=pt(d,.9);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('');
  let icons='',labels='';
  for(const s of SEC_DEF){
    const items=r.rows.filter(x=>secOf(x.id)===s.k).slice(0,s.max);
    if(!items.length){const [ex,ey]=pt(s.a,.52);labels+=`<span class="pl-empty" style="left:${ex}px;top:${ey}px">无${s.n}</span>`;continue}
    s.slots[items.length].forEach(([da,rf],i)=>{const [x,y]=pt(s.a+da,rf);const it=items[i];
      icons+=`<span class="pl-i ${it.ok?'':'miss'} ${it.opt?'opt':''}" style="left:${(x-isz/2).toFixed(1)}px;top:${(y-isz/2).toFixed(1)}px">${ico(it.id,isz)}</span>`});
  }
  return `<div class="plate t-${dish.t}" style="--p:${size}px" role="img" aria-label="${esc(dish.n)}：${r.rows.map(x=>x.n).join('、')}">
    <svg viewBox="0 0 ${size} ${size}" class="pl-svg" aria-hidden="true">
      <circle cx="${R}" cy="${R}" r="${R-1}" class="pl-rim"/><circle cx="${R}" cy="${R}" r="${R*0.9}" class="pl-well"/>
      <g class="pl-div">${divs}</g><circle cx="${R}" cy="${R}" r="${R*0.15}" class="pl-hub"/>
    </svg>${icons}${labels}<span class="pl-c" style="font-size:${Math.round(size*0.1)}px">${TSYM[dish.t]}</span></div>`;
}
function stepsHtml(dish){
  const st=STEPS[dish.d]||[];
  const fmt=t=>esc(t)
    .replace(/\{(\w+)\}/g,(_,id)=>ico(id,24))
    .replace(/✓(\S+)/g,'<span class="yes">✓$1</span>')
    .replace(/✗(\S+)/g,'<span class="no">✗$1</span>')
    .replace(/→/g,'<span class="arr">→</span>');
  return `<ol class="flow">${st.map(t=>`<li><span class="fx">${fmt(t)}</span></li>`).join('')}</ol>`;
}

  </div>`;
  document.getElementById('prev-day').onclick=()=>{offset--;renderToday()};
  const bt=document.getElementById('back-today');if(bt)bt.onclick=()=>{offset=0;renderToday()};
  document.getElementById('next-day').onclick=()=>{offset++;renderToday()};
  document.getElementById('open-dish').onclick=()=>dishSheet(dish);
  const ob=document.getElementById('open-buy');if(ob)ob.onclick=()=>listSheet('今天买菜',buy);
  const hero=document.getElementById('hero');let x0=null,y0=null;
  hero.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  hero.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){offset+=dx<0?1:-1;renderToday()}},{passive:true});
}

/* ---------- 冰箱 ---------- */
function planMeals(cands){
  const rem={};S.have.filter(id=>I[id].c==='fresh').forEach(id=>rem[id]=qtyOf(id));
  const start={...rem};const picked=[];
  for(let k=0;k<6;k++){
    let best=null,bs=-1,bu=null;
    for(const c of cands){
      if(picked.some(p=>p.dish===c.dish))continue;
      const uses=c.fresh.filter(id=>rem[id]>0);if(!uses.length)continue;
      const s=uses.length*10+({g:3,y:2,r:0}[c.dish.t]);
      if(s>bs){bs=s;best=c;bu=uses}
    }
    if(!best)break;
    bu.forEach(id=>rem[id]--);picked.push({dish:best.dish,uses:bu});
    if(Object.values(rem).every(x=>x<=0))break;
  }
  return {picked,start,rem};
}
function computeFridge(){
  const all=DISH.map(d=>({dish:d,...resolve(d)})).filter(x=>!(S.hideFire&&x.dish.t==='r'));
  const score=x=>x.fresh.length*10+({g:3,y:2,r:0}[x.dish.t]);
  const ok=all.filter(x=>!x.missing.length).sort((a,b)=>score(b)-score(a));
  const near=all.filter(x=>x.missing.length===1).sort((a,b)=>score(b)-score(a));
  return {ok,near};
}
function renderFridge(){
  const v=document.getElementById('v-fridge');
  const {ok,near}=computeFridge();
  const seg=`<div class="seg" role="group" aria-label="冰箱视图">
    <button data-fv="have" aria-pressed="${S.fview==='have'}">我有</button>
    <button data-fv="can" aria-pressed="${S.fview==='can'}">能做 <span class="badge num">${ok.length}</span></button></div>`;
  let body='';
  if(S.fview==='have'){
    body=['fresh','frozen','keep'].map(c=>`
      <div class="group">
        <h2>${CLS[c].n}<small>${CLS[c].hint}</small></h2>
        <div class="tiles">${ING.filter(x=>x.c===c).map(x=>`<button class="tile" data-ing="${x.id}" aria-pressed="${has(x.id)}">${ico(x.id,34)}<span class="tn">${esc(x.n.replace(/（.*）/,''))}</span>${c==='fresh'&&has(x.id)?`<span class="svd" aria-label="还剩 ${qtyOf(x.id)} 顿">${'●'.repeat(Math.min(qtyOf(x.id),5))}</span>`:''}</button>`).join('')}</div>
      </div>`).join('')+`<p class="sub" style="margin:0">调料 默认有 · 不用勾</p>`;
  }else{
    const freshHave=S.have.filter(id=>I[id].c==='fresh');
    const {picked,start,rem}=planMeals(ok);
    const left=Object.entries(rem).filter(([,x])=>x>0);
    let planHtml;
    if(!freshHave.length)planHtml=`<div class="empty">无短保 · 不赶 · 随便挑</div>`;
    else if(!picked.length)planHtml=`<div class="empty">短保 用不上 → 看「差一样」</div>`;
    else{
      const cols=picked.length;
      planHtml=`<div class="card">
        <div class="sechead"><h2>吃完计划</h2><span class="sub">${cols} 顿</span></div>
        <div class="matrix" style="--cols:${cols}">
          <span></span>${picked.map((p,i)=>`<button class="mx-h" data-dish="${p.dish.d}" aria-label="第${i+1}顿 ${esc(p.dish.n)}"><span class="num">${i+1}</span><span class="dot ${p.dish.t}"></span></button>`).join('')}<span class="mx-h sub">剩</span>
          ${freshHave.map(id=>{let r=start[id];return `<span class="mx-r">${ico(id,24)}</span>${picked.map(p=>{const used=p.uses.includes(id);if(used)r--;return `<span class="mx-c">${used?'<span class="mx-on"></span>':''}</span>`}).join('')}<span class="mx-c num ${r>0?'mx-left':'mx-zero'}">${r>0?r:'✓'}</span>`}).join('')}
        </div>
        <ol class="plan">${picked.map((p,i)=>`<li><span class="k">第 ${i+1} 顿</span><button data-dish="${p.dish.d}"><span class="dot ${p.dish.t}"></span>${esc(p.dish.n)}</button><span class="u">${p.uses.map(id=>ico(id,20)).join('')}</span></li>`).join('')}</ol>
        ${left.length?`<div class="verdict left">剩 ${left.map(([id,n])=>`${I[id].n} ${n}`).join(' · ')} → 加餐 / 补一样</div>`:`<div class="verdict ok">✓ 刚好吃完</div>`}
        <details class="adj"><summary class="adjust">剩几顿 ±</summary>
          <div class="steps">${freshHave.map(id=>`<div class="st"><span class="ing-n">${ico(id,26)}${esc(I[id].n)} <small class="muted">${esc(I[id].unit)}≈${I[id].serv} 顿</small></span><span class="ctl"><button data-dec="${id}" aria-label="${esc(I[id].n)}少一顿">−</button><output class="num">${qtyOf(id)} 顿</output><button data-inc="${id}" aria-label="${esc(I[id].n)}多一顿">＋</button></span></div>`).join('')}</div>
        </details>
      </div>`;
    }
    const row=(x,warn)=>`<button data-dish="${x.dish.d}">${plateMini(x.dish)}<span class="tx"><strong>${esc(x.dish.n)}</strong>${warn?`<span class="warn">差 ${esc(x.missing[0].n)}</span>`:`<span>${x.fresh.length?'消耗 '+x.fresh.map(id=>I[id].n).join(' · '):esc(x.dish.tool)}</span>`}</span><span class="chev">›</span></button>`;
    const snacks=SNACK.filter(s=>resolve(s).missing.length===0);
    body=`${planHtml}
      <div class="filter"><button class="chip" id="hide-fire" aria-pressed="${S.hideFire}">✗🔥 开火</button></div>
      <div class="sechead"><h2>能做</h2><span class="sub num">${ok.length} 道</span></div>
      ${ok.length?`<div class="list">${ok.map(x=>row(x,false)).join('')}</div>`:'<div class="empty">无</div>'}
      <div class="sechead"><h2>差一样</h2><span class="sub num">${near.length} 道</span></div>
      ${near.length?`<div class="list">${near.map(x=>row(x,true)).join('')}</div>`:'<div class="empty">无</div>'}
      <div class="sechead"><h2>加餐</h2></div>
      <div class="scroller">${snacks.map(s=>`<span class="snk">${s.need.map(([k])=>ico(k,30)).join('')}<span>${esc(s.n)}</span></span>`).join('')||'<span class="sub">无</span>'}</div>`;
  }
  v.innerHTML=`<div class="vhead"><h1><img src="logo.svg" alt="" class="brandmark">冰箱</h1><a class="toplink" href="#legend">图例 ›</a></div>${seg}${body}`;

  const cta=document.getElementById('cta');
  cta.hidden=!(S.fview==='have'&&location.hash==='#fridge');
  document.getElementById('cta-btn').textContent=`能做 ${ok.length} 道 →`;

  v.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{S.fview=b.dataset.fv;save();renderFridge();window.scrollTo(0,0)});
  v.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ing;
    if(has(id)){S.have=S.have.filter(x=>x!==id);delete S.qty[id]}else S.have=[...S.have,id];
    save();renderFridge();renderToday();renderMonth();
  });
  v.querySelectorAll('[data-dish]').forEach(b=>b.onclick=()=>dishSheet(DISH.find(d=>String(d.d)===b.dataset.dish)));
  v.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc;S.qty[id]=Math.min(9,qtyOf(id)+1);save();renderFridgeKeepAdj()});
  v.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec;S.qty[id]=Math.max(1,qtyOf(id)-1);save();renderFridgeKeepAdj()});
  const hf=document.getElementById('hide-fire');if(hf)hf.onclick=()=>{S.hideFire=!S.hideFire;save();renderFridge()};
}
function renderFridgeKeepAdj(){renderFridge();const d=document.querySelector('#v-fridge details.adj');if(d)d.open=true}
function plateMini(dish){
  const r=resolve(dish);
  return `<span class="mini t-${dish.t}" aria-hidden="true">${r.rows.filter(x=>!x.opt).slice(0,3).map(x=>ico(x.id,22,x.ok?'':'miss')).join('')}</span>`;
}

/* ---------- 月菜单 ---------- */
function renderMonth(){
  const v=document.getElementById('v-month');
  const cur=dayInfo(0);const todayN=cur.before?-1:cur.n;
  const seg=`<div class="seg" role="group" aria-label="月菜单视图">
    <button data-mv="cal" aria-pressed="${S.mview==='cal'}">日历</button>
    <button data-mv="buy" aria-pressed="${S.mview==='buy'}">采购</button></div>`;
  let body='';
  if(S.mview==='cal'){
    const mainIcon=d=>{const k=d.need.map(([k])=>k.split('|')[0]).find(k=>I[k].c==='frozen'||['tofu','doupi','trotter','rawchicken','rtechicken','egg','silken','instant'].includes(k))||d.need[0][0].split('|')[0];return k};
    const cnt={g:0,y:0,r:0};DISH.filter(d=>d.d).forEach(d=>cnt[d.t]++);
    body=`
      <div class="legend"><span><span class="dot g"></span>不开火 ${cnt.g}</span><span><span class="dot y"></span>电器 ${cnt.y}</span><span><span class="dot r"></span>开火 ${cnt.r}</span><span><span class="bdot"></span>买菜</span></div>
      <div class="cal">
        ${['一','二','三','四','五','六','日'].map(w=>`<span class="cal-w">${w}</span>`).join('')}
        ${[...Array(28)].map((_,i)=>{const n=i+1,d=dayDish(n);return `<button class="cal-d t-${d.t} ${n===todayN?'today':''}" data-day="${n}" aria-label="第${n}天 ${esc(d.n)} ${TIER[d.t]}${BUY[n]?' 买菜日':''}"><span class="cal-n num">${n}</span>${ico(mainIcon(d),26)}${BUY[n]?'<span class="bdot"></span>':''}</button>`}).join('')}
      </div>
      <p class="sub" style="margin:0">点格子 → 用量 · 做法</p>
      <div class="card">
        <div class="field"><label for="start-date">第 1 天</label><input type="date" id="start-date" value="${S.start}"></div>
        <span class="sub">28 天一轮 · 换顺序 ✓整周 ✗单天</span>
      </div>`;
  }else{
    const weekOf=n=>Math.ceil(n/7);
    const ck=(k,t)=>`<li><label><input type="checkbox" id="${k}" data-chk="${k}" ${S.checks[k]?'checked':''}><span>${esc(t)}</span></label></li>`;
    body=`
      <div class="card"><div class="sechead"><h2>月初 · 一次买齐</h2><button class="btn-quiet" id="reset-checks">清空勾选</button></div>
        ${Object.entries(STOCK).map(([g,items])=>`<div><div class="label">${esc(g)}</div><ul class="checks">${items.map((it,i)=>ck(`s-${g}-${i}`,it)).join('')}</ul></div>`).join('')}
      </div>
      ${Object.keys(BUY).map(Number).map(n=>`<div class="card"><div class="sechead"><h2>第 ${weekOf(n)} 周 · 第 ${n} 天</h2><span class="icons">${buyIcons(BUY[n]).slice(0,5).map(id=>ico(id,22)).join('')}</span></div>
        <ul class="checks">${BUY[n].map((it,i)=>ck(`b${n}-${i}`,it)).join('')}</ul></div>`).join('')}`;
  }
  v.innerHTML=`<div class="vhead"><h1><img src="logo.svg" alt="" class="brandmark">月菜单</h1><span class="sub">4 周 · 28 道</span></div>${seg}${body}`;
  v.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{S.mview=b.dataset.mv;save();renderMonth()});
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>dishSheet(dayDish(+b.dataset.day)));
  const sd=document.getElementById('start-date');if(sd)sd.onchange=e=>{if(e.target.value){S.start=e.target.value;save();offset=0;renderToday();renderMonth()}};
  v.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{S.checks[c.dataset.chk]=c.checked;save()});
  const rc=document.getElementById('reset-checks');if(rc)rc.onclick=()=>{S.checks={};save();renderMonth()};
}

/* ---------- 图例 ---------- */
function dishesUsing(id){return DISH.filter(d=>[...d.need.map(([k])=>k),...(d.opt||[]).map(([k])=>k)].some(k=>k.split('|').includes(id)))}
function renderLegend(){
  const v=document.getElementById('v-legend');
  const secs=[{k:'veg',n:'菜',f:'½ 盘'},{k:'pro',n:'肉蛋豆',f:'¼ 盘'},{k:'carb',n:'饭',f:'¼ 盘'}];

  <div class="vhead"><h1><img src="logo.svg" alt="" class="brandmark">图例</h1><a class="toplink" href="#fridge">‹ 冰箱</a></div>

      <div class="label">餐盘</div>

    ${sym(pill('y'),'电器','空气炸锅 · 电煮锅 · 电饭锅 · 烧水')}
    ${sym(pill('r'),'开火','炒锅 · 每周 ≤1 次')}
    ${sym('<span class="yes">✓蘸</span> <span class="no">✗拌</span>','要 / 不要','做法里 绿=要 红=不要')}
    ${sym('<span class="arr" style="font-size:20px">→</span>','然后','下一步 / 移到')}
    ${sym(ico('tofu',30,'miss'),'缺','冰箱 没勾 → 灰 + 红圈')}
    ${sym('<span class="svd" style="font-size:12px">●●●</span>','还剩几顿','短保食材 · 冰箱页')}
    ${sym('<span class="lg-mx"><span class="mx-on"></span></span>','这顿用掉','吃完计划 矩阵')}

    ${sym('<span class="pill t-p">🍲 一锅出</span>','一锅出','电饭锅 煲仔饭 · 饭菜 一锅')}

    openSheet(x.n,`

/* ---------- 路由 ---------- */
function route(){
  const tab=(location.hash||'#today').slice(1);
  const t=['today','fridge','month','legend'].includes(tab)?tab:'today';
  ['today','fridge','month','legend'].forEach(x=>document.getElementById('v-'+x).hidden=x!==t);
  document.querySelectorAll('.tabbar a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===t?'page':'false'));
  document.getElementById('cta').hidden=!(t==='fridge'&&S.fview==='have');
  closeSheet();window.scrollTo(0,0);
}
document.getElementById('cta-btn').onclick=()=>{S.fview='can';save();renderFridge();document.getElementById('cta').hidden=true;window.scrollTo(0,0)};
window.addEventListener('hashchange',route);
document.querySelector('.tabbar a[data-tab="today"]').addEventListener('click',()=>{if(offset!==0){offset=0;renderToday()}});
renderToday();renderFridge();renderMonth();renderLegend();route();
</script>
