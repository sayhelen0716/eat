<title>蘸酱饭桌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  --bg:#F1F4EC; --surface:#FBFCF8; --sunk:#E6EBDF; --ink:#1E2620; --muted:#5C685E; --line:#D5DCCD;
  --accent:#5B3A6E; --accent-soft:#E9E0EF; --on-accent:#FFFFFF;
  --g:#2E7A4C; --g-soft:#DDEEDF; --y:#9A6412; --y-soft:#F5E8CF; --r:#A8412C; --r-soft:#F6DDD5;
  --display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131712; --surface:#1B2019; --sunk:#232A21; --ink:#E4EAE0; --muted:#9BA696; --line:#2F382C;
    --accent:#C3A2D6; --accent-soft:#35293D; --on-accent:#1B1420;
    --g:#74C394; --g-soft:#1F3326; --y:#E3AE55; --y-soft:#3A2E17; --r:#EC8870; --r-soft:#3D231C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131712; --surface:#1B2019; --sunk:#232A21; --ink:#E4EAE0; --muted:#9BA696; --line:#2F382C;
  --accent:#C3A2D6; --accent-soft:#35293D; --on-accent:#1B1420;
  --g:#74C394; --g-soft:#1F3326; --y:#E3AE55; --y-soft:#3A2E17; --r:#EC8870; --r-soft:#3D231C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
.wrap>*,.panel>*,.daycard>*,.card>*{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:26px}
.brand small{color:var(--muted);font-size:12px;text-align:right;min-width:0}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
nav.tabs a{text-align:center;text-decoration:none;color:var(--muted);padding:7px 0;border-radius:7px;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.t-g{background:var(--g-soft);color:var(--g)}
.t-y{background:var(--y-soft);color:var(--y)}
.t-r{background:var(--r-soft);color:var(--r)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}

/* today */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.daycard .dish{font-size:30px;line-height:1.25}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
ul.ing{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px}
ul.ing li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-block:3px}
ul.ing li span:last-child{color:var(--muted);font-size:13px}
ul.ing li.miss span:first-child{color:var(--r);font-weight:600}
.how{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.notice b{white-space:nowrap}
.n-buy{background:var(--accent-soft)}
.n-thaw{background:var(--sunk)}
.snack{display:flex;flex-direction:column;gap:6px}
.snack .formula{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.static{cursor:default}

/* fridge */
.group h3{font-size:17px;display:flex;align-items:baseline;gap:8px}
.group h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.stepper .ctl output{min-width:48px;text-align:center}
.plan{counter-reset:p;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.plan li::before{counter-increment:p;content:"第" counter(p) "顿";font-size:12px;color:var(--accent);font-weight:600;padding-top:3px;white-space:nowrap}
.plan .uses{grid-column:2;font-size:13px;color:var(--muted)}
.left{font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .title strong{font-size:16px}
.tag{font-size:12px;color:var(--accent);font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* month */
details.day{border-bottom:1px solid var(--line)}
details.day summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 2px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day summary .d{color:var(--muted);font-size:13px}
details.day.is-today summary .d{color:var(--accent);font-weight:700}
details.day .body{padding:0 2px 14px 52px;display:flex;flex-direction:column;gap:8px}
.week{display:flex;flex-direction:column}
.week h2{font-size:20px;padding-block:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:center;padding:4px 0}
.checks input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:220px}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>蘸酱饭桌</h1><small>一人食 · 1.5 餐/天 · 能不开火就不开火</small></div>
    <nav class="tabs" aria-label="页面">
      <a href="#today" data-tab="today">今天</a>
      <a href="#fridge" data-tab="fridge">冰箱</a>
      <a href="#month" data-tab="month">月菜单</a>
    </nav>
  </header>

  <section class="view" id="v-today"></section>
  <section class="view" id="v-fridge" hidden></section>
  <section class="view" id="v-month" hidden></section>
</div>

<script>
/* ---------- 数据 ---------- */
const ING=[
 {id:'lettuce',n:'生菜',c:'fresh',serv:3,unit:'1 颗'},
 {id:'perilla',n:'紫苏',c:'fresh',serv:2,unit:'1 把'},
 {id:'cilantro',n:'香菜',c:'fresh',serv:3,unit:'1 把'},
 {id:'tofu',n:'豆腐',c:'fresh',serv:2,unit:'1 块'},
 {id:'doupi',n:'豆皮',c:'fresh',serv:2,unit:'1 份'},
 {id:'silken',n:'内酯豆腐',c:'fresh',serv:1,unit:'1 盒'},
 {id:'loofah',n:'丝瓜',c:'fresh',serv:2,unit:'1 根'},
 {id:'pumpkin',n:'南瓜',c:'fresh',serv:3,unit:'1 个小的'},
 {id:'trotter',n:'卤猪蹄',c:'fresh',serv:1,unit:'半只'},
 {id:'rawchicken',n:'生鸡胸',c:'fresh',serv:2,unit:'1 块'},
 {id:'cucumber',n:'黄瓜',c:'keep'},{id:'carrot',n:'胡萝卜',c:'keep'},{id:'scallion',n:'葱',c:'keep'},{id:'garlic',n:'蒜',c:'keep'},
 {id:'egg',n:'鸡蛋',c:'keep'},{id:'rtechicken',n:'即食鸡胸',c:'keep'},{id:'rice',n:'米饭',c:'keep'},{id:'noodles',n:'挂面',c:'keep'},
 {id:'jianbing',n:'煎饼',c:'keep'},{id:'nuts',n:'坚果包',c:'keep'},{id:'milk',n:'纯牛奶',c:'keep'},{id:'yogurt',n:'无糖酸奶',c:'keep'},
 {id:'fruit',n:'水果',c:'keep'},{id:'instant',n:'方便面',c:'keep'},
 {id:'shrimp',n:'虾 / 虾仁',c:'frozen'},{id:'beef',n:'肥牛卷',c:'frozen'},{id:'drumstick',n:'鸡腿',c:'frozen'},{id:'wings',n:'鸡翅',c:'frozen'},
 {id:'steak',n:'牛排',c:'frozen'},{id:'porkchop',n:'猪排',c:'frozen'},{id:'porkbelly',n:'五花肉',c:'frozen'},{id:'fish',n:'鱼块',c:'frozen'},
 {id:'salmon',n:'三文鱼（刺身级）',c:'frozen'}
];
const I=Object.fromEntries(ING.map(x=>[x.id,x]));
const CLS={fresh:{n:'短保',hint:'2～3 天内要吃完'},keep:{n:'耐放',hint:'1～3 周'},frozen:{n:'冷冻',hint:'按顿分装，前一晚拿到冷藏解冻'}};
const TIER={g:'不开火',y:'只用电器',r:'要开火'};

const DISH=[
 {d:1,n:'蘸酱菜',t:'g',tool:'不用加热',need:[['tofu','半块'],['doupi','半份'],['lettuce','1/3 颗'],['cucumber','1 根'],['scallion','2 根'],['rice','1 碗']],opt:[['cilantro','少许']],how:'全部洗净切条，大酱装小碟，蘸着吃，不拌。'},
 {d:2,n:'豆皮卷',t:'g',tool:'不用加热',need:[['doupi','半份'],['rtechicken','1 袋'],['cucumber','半根'],['lettuce','几片'],['scallion','1 根']],how:'豆皮铺开，薄抹一层酱，卷鸡胸、黄瓜条、生菜和葱。'},
 {d:3,n:'电煮锅小火锅',t:'y',tool:'电煮锅',need:[['tofu','半块'],['beef','1 份'],['lettuce','1/3 颗']],opt:[['cilantro','少许']],how:'清水加几片葱姜做汤底，下豆腐煮 3 分钟，再涮肥牛和生菜。蘸料少放。'},
 {d:4,n:'三文鱼紫苏包饭',t:'g',tool:'不用加热',need:[['salmon','1 份'],['perilla','半把'],['rice','1 碗']],how:'三文鱼前一晚移到冷藏解冻，切片。紫苏叶包饭和鱼，蘸少许芥末生抽。'},
 {d:5,n:'空气炸鸡腿 · 紫苏生菜包',t:'y',tool:'空气炸锅',need:[['drumstick','2 只'],['perilla','半把'],['lettuce','几片'],['rice','1 碗']],how:'鸡腿划两刀，抹薄盐和黑胡椒，200℃ 20 分钟，中途翻面。拆肉用叶子包着吃。'},
 {d:6,n:'白灼虾 · 凉拌胡萝卜丝',t:'y',tool:'烧水',need:[['shrimp','1 份'],['carrot','1 根'],['rice','1 碗']],how:'水开下虾，变红卷起就捞。胡萝卜擦丝，加醋、少许盐、几滴香油。'},
 {d:7,n:'公瑾爆蛋（减糖版）',t:'r',tool:'炒锅',need:[['egg','2 个'],['garlic','3 瓣'],['scallion','1 根'],['cucumber','半根'],['rice','1 碗']],how:'料汁：生抽 1 勺、白醋 1 勺、番茄酱 1 勺、清水 2 勺，不放糖和老抽。少油煎蛋至边缘焦脆，下蒜末，倒料汁收浓。'},
 {d:8,n:'煎饼卷鸡胸',t:'g',tool:'不用加热',need:[['jianbing','1 张'],['rtechicken','1 袋'],['lettuce','几片'],['cucumber','半根'],['scallion','1 根']],how:'煎饼薄抹一层酱，鸡胸撕开，和菜一起卷起来。'},
 {d:9,n:'肥牛生菜挂面',t:'y',tool:'电煮锅',need:[['noodles','1 把'],['beef','1 份'],['lettuce','1/3 颗']],opt:[['cilantro','少许']],how:'面煮熟，下肥牛烫到变色，最后放生菜。汤里少放盐，撒香菜。'},
 {d:10,n:'煎饼卷肥牛',t:'y',tool:'烧水',need:[['jianbing','1 张'],['beef','1 份'],['lettuce','几片'],['cucumber','半根']],how:'肥牛开水烫熟沥干，和生菜、黄瓜条一起卷进煎饼。'},
 {d:11,n:'丝瓜虾仁汤',t:'y',tool:'电煮锅',need:[['loofah','半根'],['shrimp','1 份'],['rice','1 碗']],how:'丝瓜去皮切块，水开下丝瓜煮 2 分钟，再下虾仁煮熟，少许盐。'},
 {d:12,n:'丝瓜炒蛋',t:'r',tool:'炒锅',need:[['loofah','半根'],['egg','2 个'],['rice','1 碗']],how:'少油先炒蛋盛出，再炒丝瓜到软，倒回鸡蛋，少许盐。'},
 {d:13,n:'空气炸鸡翅',t:'y',tool:'空气炸锅',need:[['wings','4～6 只'],['cucumber','半根'],['carrot','半根'],['rice','1 碗']],how:'鸡翅两面划刀，薄抹生抽和黑胡椒，200℃ 18 分钟，中途翻面。配黄瓜胡萝卜条。'},
 {d:14,n:'虾仁挂面 · 小葱拌豆腐',t:'y',tool:'电煮锅',need:[['noodles','1 把'],['shrimp','1 份'],['silken','1 盒'],['scallion','2 根']],how:'面煮熟下虾仁。内酯豆腐倒扣切块，撒葱花，淋几滴生抽和香油。'},
 {d:15,n:'南瓜焖饭 · 即食鸡胸',t:'y',tool:'电饭锅',need:[['pumpkin','1/3 个'],['rice','米 1 杯'],['rtechicken','1 袋']],how:'南瓜切小块，和米一起放电饭锅，水比平时略少，按煮饭键。配鸡胸。'},
 {d:16,n:'空气炸三文鱼 · 南瓜块',t:'y',tool:'空气炸锅',need:[['salmon','1 份'],['pumpkin','1/3 个']],how:'南瓜块先进锅 200℃ 8 分钟，再放三文鱼一起 10 分钟。三文鱼只撒黑胡椒。'},
 {d:17,n:'鸡腿胡萝卜焖饭',t:'y',tool:'电饭锅',need:[['drumstick','1～2 只'],['carrot','1 根'],['rice','米 1 杯']],how:'鸡腿去骨切块，用少许生抽抓匀，和胡萝卜丁、米一起放电饭锅，正常煮饭。'},
 {d:18,n:'紫苏包饭 · 鱼汤',t:'y',tool:'电煮锅',need:[['fish','1 份'],['perilla','半把'],['rice','1 碗']],opt:[['scallion','1 根']],how:'鱼块冷水下锅，放葱段，小火炖 20 分钟到汤白，少许盐。紫苏叶包饭配汤。'},
 {d:19,n:'空气炸猪排',t:'y',tool:'空气炸锅',need:[['porkchop','1 块'],['lettuce','几片'],['rice','1 碗']],how:'猪排用刀背拍松，抹薄盐和黑胡椒，200℃ 15 分钟，中途翻面。'},
 {d:20,n:'三文鱼拌饭',t:'g',tool:'不用加热',need:[['salmon','1 份'],['cucumber','半根'],['scallion','1 根'],['rice','1 碗']],opt:[['perilla','几片']],how:'三文鱼和黄瓜切丁，铺在米饭上，撒葱花和紫苏丝，几滴生抽。'},
 {d:21,n:'水煎肉',t:'r',tool:'炒锅',need:[['porkbelly','1 份'],['lettuce','几片'],['garlic','3 瓣'],['rice','1 碗']],how:'五花肉片不放油，小火煎出油后倒掉多余的油。生菜包肉和蒜片吃。'},
 {d:22,n:'卤猪蹄生菜包饭',t:'g',tool:'不用加热',need:[['trotter','半只'],['lettuce','1/3 颗'],['rice','1 碗']],how:'卤猪蹄本身够咸，这顿不再加酱。'},
 {d:23,n:'白切鸡胸',t:'y',tool:'电煮锅',need:[['rawchicken','半块'],['lettuce','几片'],['cucumber','半根'],['scallion','1 根'],['rice','1 碗']],how:'整块鸡胸冷水下锅，水开后转小火 12 分钟，关火焖 5 分钟。手撕，蔬菜蘸酱。另一半留着明天吃。'},
 {d:24,n:'凉拌鸡丝',t:'g',tool:'不用加热',need:[['rawchicken|rtechicken','半块 / 1 袋'],['cucumber','半根'],['carrot','半根'],['rice','1 碗']],opt:[['cilantro','少许']],how:'鸡胸撕丝，加黄瓜丝、胡萝卜丝，醋和少许生抽拌匀。'},
 {d:25,n:'肥牛生菜包饭',t:'y',tool:'烧水',need:[['beef','1 份'],['lettuce','1/3 颗'],['rice','1 碗']],how:'肥牛开水烫熟，生菜包饭和肉，蘸一点点酱。'},
 {d:26,n:'空气炸牛排',t:'y',tool:'空气炸锅',need:[['steak','1 块'],['cucumber','半根'],['carrot','半根']],how:'牛排提前回温，抹黑胡椒，200℃ 每面 5～6 分钟，静置 3 分钟再切。'},
 {d:27,n:'三文鱼煎饼卷',t:'g',tool:'不用加热',need:[['salmon','1 份'],['jianbing','1 张'],['lettuce','几片'],['cucumber','半根']],how:'三文鱼切条，和生菜、黄瓜条卷进煎饼，挤一点芥末。'},
 {d:28,n:'豆腐抱蛋',t:'r',tool:'炒锅',need:[['tofu','1 块'],['egg','2 个'],['shrimp','几只'],['beef','几片'],['scallion','1 根'],['rice','1 碗']],opt:[['cilantro','少许']],how:'豆腐切块少油煎到两面金黄，淋蛋液，放虾和肥牛，加盖焖熟，撒葱花香菜。'},
 {d:0,n:'方便面（应急）',t:'y',tool:'电煮锅',need:[['instant','1 包']],opt:[['egg','1 个'],['lettuce','几片']],how:'调料包只放一半，打个蛋，加把青菜。只在实在不想动时用。'}
];
const SNACK=[
 {n:'纯牛奶 1 盒',need:[['milk','1 盒']]},
 {n:'无糖酸奶 1 杯',need:[['yogurt','1 杯']]},
 {n:'水煮蛋 1 个',need:[['egg','1 个']],how:'电煮锅一次煮 3～4 个，冷藏放 2～3 天。'},
 {n:'黄瓜条',need:[['cucumber','半根']]},
 {n:'胡萝卜条',need:[['carrot','半根']]},
 {n:'拍黄瓜',need:[['cucumber','1 根'],['garlic','2 瓣']]},
 {n:'蒸南瓜 1 小块',need:[['pumpkin','一小块']],how:'和米饭一起放进电饭锅蒸屉。'},
 {n:'即食鸡胸半块',need:[['rtechicken','半袋']]},
 {n:'小葱拌豆腐',need:[['silken','半盒'],['scallion','1 根']]},
 {n:'豆皮卷黄瓜',need:[['doupi','小半份'],['cucumber','半根']]},
 {n:'白灼虾几只',need:[['shrimp','几只']]},
 {n:'水果 1 份',need:[['fruit','1 份']]},
 {n:'半张煎饼卷生菜',need:[['jianbing','半张'],['lettuce','几片']]}
];
const BUY={
 1:['生菜 1 颗','豆腐 1 块','豆皮 1 份','香菜 1 把','黄瓜 3～4 根','胡萝卜','葱'],
 4:['紫苏 1 把','生菜 1 颗'],
 8:['生菜 1 颗','香菜 1 把','黄瓜 3～4 根','胡萝卜','葱'],
 11:['丝瓜 1 根','内酯豆腐 1 盒'],
 15:['小南瓜 1 个','黄瓜 3～4 根','胡萝卜','葱'],
 18:['紫苏 1 把','生菜 1 颗'],
 22:['生菜 1 颗','卤猪蹄 半只','生鸡胸 1 块','黄瓜 3～4 根','胡萝卜','葱'],
 25:['生菜 1 颗','豆腐 1 块','香菜 1 把']
};
const STOCK={
 '冷冻（按顿分装）':['虾仁 3～4 份','肥牛卷 5 份','鸡腿 3～4 只','鸡翅 1 份','牛排 1 块','猪排 1 块','五花肉 1 份','鱼块 1 份','刺身级三文鱼 4 份'],
 '耐放':['鸡蛋 1 盒','即食鸡胸 5 袋','挂面','煎饼','米','坚果包','常温纯牛奶'],
 '调料':['大酱','低钠生抽','醋','香油','番茄酱','芥末','黑胡椒']
};

/* ---------- 状态 ---------- */
const KEY='dzfz-v1';
const DEFAULT_HAVE=['rice','egg','scallion','garlic','cucumber','carrot','rtechicken','noodles','jianbing','nuts','milk','shrimp','beef','drumstick','salmon','lettuce'];
function nextMonday(){const t=new Date();t.setHours(0,0,0,0);const w=t.getDay();const add=w===1?0:((8-w)%7);t.setDate(t.getDate()+add);return iso(t)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let S={start:nextMonday(),have:DEFAULT_HAVE,qty:{},hideFire:false,checks:{},offset:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
S.offset=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({start:S.start,have:S.have,qty:S.qty,hideFire:S.hideFire,checks:S.checks}))}catch(e){}}
const has=id=>S.have.includes(id);
const qtyOf=id=>S.qty[id]??I[id].serv;

/* ---------- 工具函数 ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nameOf(key){return key.split('|').map(k=>I[k].n).join(' 或 ')}
function resolve(dish,haveFn=has){
  const rows=[];let missing=[];const fresh=[];
  for(const [key,q] of dish.need){
    const ids=key.split('|');const got=ids.find(haveFn);
    if(got){rows.push({n:I[got].n,q,ok:true});if(I[got].c==='fresh')fresh.push(got)}
    else{rows.push({n:nameOf(key),q,ok:false});missing.push(nameOf(key))}
  }
  for(const [key,q] of (dish.opt||[])){
    const got=haveFn(key)?key:null;
    rows.push({n:I[key].n+'（可选）',q,ok:true,opt:true});
    if(got&&I[got].c==='fresh')fresh.push(got);
  }
  return {rows,missing,fresh};
}
const pill=t=>`<span class="pill t-${t}"><span class="dot ${t}"></span>${TIER[t]}</span>`;
function ingList(rows){return `<ul class="ing">${rows.map(r=>`<li class="${r.ok?'':'miss'}"><span>${esc(r.n)}</span><span>${esc(r.q)}</span></li>`).join('')}</ul>`}
const dayDish=n=>DISH.find(x=>x.d===n);

function dayInfo(offset){
  const start=new Date(S.start+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+offset);
  const idx=Math.round((t-start)/864e5);
  const before=idx<0;const i=before?0:idx;
  return {date:t,before,daysTo:-idx,n:(i%28)+1,cycle:Math.floor(i/28)+1};
}
const WD=['周日','周一','周二','周三','周四','周五','周六'];

/* ---------- 今天 ---------- */
function renderToday(){
  const v=document.getElementById('v-today');
  const info=dayInfo(S.offset);const dish=dayDish(info.n);const r=resolve(dish);
  const week=Math.ceil(info.n/7);
  const next=dayDish((info.n%28)+1);
  const thaw=next.need.map(([k])=>k.split('|')[0]).filter(k=>I[k].c==='frozen').map(k=>I[k].n);
  const buy=BUY[info.n];
  const dateLabel=`${info.date.getMonth()+1}月${info.date.getDate()}日 ${WD[info.date.getDay()]}`;
  const rel=S.offset===0?'今天':S.offset===1?'明天':S.offset===-1?'昨天':(S.offset>0?S.offset+' 天后':(-S.offset)+' 天前');
  const snackOk=SNACK.filter(s=>resolve(s).missing.length===0).map(s=>s.n);
  v.innerHTML=`
  <div class="dayhead">
    <button class="btn" id="prev-day" aria-label="前一天">‹ 前一天</button>
    <div class="label num" style="text-align:center">${rel} · ${dateLabel}</div>
    <button class="btn" id="next-day" aria-label="后一天">后一天 ›</button>
  </div>
  ${info.before?`<div class="notice n-buy"><b>还没开始</b><span>菜单从 ${S.start} 开始，${info.daysTo} 天后是第 1 天。下面先预览第 1 天。起始日可以在「月菜单」里改。</span></div>`:''}
  <article class="daycard">
    <div class="meta num"><span>第 ${week} 周 · 第 ${info.n} 天 / 28</span>${info.cycle>1?`<span>· 第 ${info.cycle} 轮</span>`:''}</div>
    <h2 class="dish">${esc(dish.n)}</h2>
    <div class="meta">${pill(dish.t)}<span>${esc(dish.tool)}</span></div>
    ${ingList(r.rows)}
    ${r.missing.length?`<div class="notice n-thaw"><b>冰箱里没有</b><span>${r.missing.map(esc).join('、')}。去「冰箱」看看能换成哪道菜。</span></div>`:''}
    <div class="how">${esc(dish.how)}</div>
  </article>
  ${buy?`<div class="notice n-buy"><b>🛒 今天买</b><span>${buy.map(esc).join('、')}</span></div>`:''}
  ${thaw.length?`<div class="notice n-thaw"><b>🧊 今晚解冻</b><span>明天吃「${esc(next.n)}」，睡前把 ${thaw.map(esc).join('、')} 从冷冻室拿到冷藏室。</span></div>`:''}
  <div class="panel snack">
    <span class="label">加餐 · 0.5 餐</span>
    <div class="formula">坚果 1 小包 ＋ 下面任选 1 样</div>
    <div class="chips">${snackOk.length?snackOk.map(n=>`<span class="chip static">${esc(n)}</span>`).join(''):'<span class="empty">冰箱里暂时没有能做加餐的，去「冰箱」勾选一下。</span>'}</div>
    <span class="muted" style="font-size:13px">先挑用当周剩下的菜做的，比如多出来的黄瓜、南瓜。</span>
  </div>`;
  document.getElementById('prev-day').onclick=()=>{S.offset--;renderToday()};
  document.getElementById('next-day').onclick=()=>{S.offset++;renderToday()};
}

/* ---------- 冰箱 ---------- */
function planMeals(cands){
  const rem={};S.have.filter(id=>I[id].c==='fresh').forEach(id=>rem[id]=qtyOf(id));
  const picked=[];
  for(let k=0;k<6;k++){
    let best=null,bs=-1,bu=null;
    for(const c of cands){
      if(picked.includes(c.dish))continue;
      const uses=[...new Set(c.fresh)].filter(id=>rem[id]>0);
      if(!uses.length)continue;
      const s=uses.length*10+({g:3,y:2,r:0}[c.dish.t]);
      if(s>bs){bs=s;best=c;bu=uses}
    }
    if(!best)break;
    bu.forEach(id=>rem[id]--);picked.push(best.dish);picked[picked.length-1]._uses=bu;
    if(Object.values(rem).every(x=>x<=0))break;
  }
  const left=Object.entries(rem).filter(([,x])=>x>0);
  return {picked,left};
}
function renderFridge(){
  const v=document.getElementById('v-fridge');
  const groups=['fresh','frozen','keep'].map(c=>`
    <div class="group panel">
      <h3>${CLS[c].n}<small>${CLS[c].hint}</small></h3>
      <div class="chips">${ING.filter(x=>x.c===c).map(x=>`<button class="chip" data-ing="${x.id}" aria-pressed="${has(x.id)}">${esc(x.n)}</button>`).join('')}</div>
    </div>`).join('');
  const freshHave=S.have.filter(id=>I[id].c==='fresh');
  const stepper=freshHave.length?`
    <div class="panel">
      <span class="label">短保食材还剩多少</span>
      <div class="stepper">${freshHave.map(id=>`
        <span>${esc(I[id].n)} <span class="muted" style="font-size:12px">（${esc(I[id].unit)}≈${I[id].serv} 顿）</span></span>
        <span class="ctl"><button data-dec="${id}" aria-label="${esc(I[id].n)}少一顿">−</button><output class="num">${qtyOf(id)} 顿</output><button data-inc="${id}" aria-label="${esc(I[id].n)}多一顿">＋</button></span>`).join('')}
      </div>
    </div>`:'';

  const all=DISH.map(d=>({dish:d,...resolve(d)})).filter(x=>!(S.hideFire&&x.dish.t==='r'));
  const ok=all.filter(x=>x.missing.length===0);
  const near=all.filter(x=>x.missing.length===1);
  const score=x=>x.fresh.length*10+({g:3,y:2,r:0}[x.dish.t]);
  ok.sort((a,b)=>score(b)-score(a));near.sort((a,b)=>score(b)-score(a));
  const {picked,left}=planMeals(ok);
  const snacks=SNACK.filter(s=>resolve(s).missing.length===0);

  const card=(x,showMiss)=>`
    <div class="card">
      <div class="title"><strong>${esc(x.dish.n)}</strong>${pill(x.dish.t)}</div>
      <div class="meta"><span>${esc(x.dish.tool)}</span>${x.dish.d?`<span>· 月菜单第 ${x.dish.d} 天</span>`:''}${x.fresh.length?`<span class="tag">· 用掉 ${[...new Set(x.fresh)].map(id=>I[id].n).join('、')}</span>`:''}</div>
      ${showMiss?`<div class="notice n-thaw" style="padding:8px 12px"><b>还差</b><span>${esc(x.missing[0])}</span></div>`:''}
      ${ingList(x.rows)}
      <div class="how">${esc(x.dish.how)}</div>
    </div>`;

  v.innerHTML=`
  <p class="muted" style="margin:0;font-size:14px">勾出冰箱里现在有的。调料（大酱、生抽、醋、香油、芥末、番茄酱）默认家里都有。</p>
  ${groups}
  ${stepper}
  <label class="toggle"><input type="checkbox" id="hide-fire" ${S.hideFire?'checked':''}> 不显示要开火的菜</label>

  <div class="panel">
    <span class="label">吃完计划</span>
    ${freshHave.length===0?'<div class="empty">没勾短保食材，不用赶时间。直接在下面挑一道想吃的。</div>':
      picked.length?`<ol class="plan">${picked.map(d=>`<li><span><strong>${esc(d.n)}</strong> ${pill(d.t)}</span><span class="uses">用掉：${d._uses.map(id=>I[id].n).join('、')}</span></li>`).join('')}</ol>
      <div class="left">${left.length?`按这个顺序吃完还剩：<strong>${left.map(([id,n])=>`${I[id].n} ${n} 顿`).join('、')}</strong>。剩下的可以拿去做加餐，或者看下面「只差一样」的菜要不要补一样。`:`<strong style="color:var(--g)">按这个顺序吃 ${picked.length} 顿，短保食材正好用完。</strong>`}</div>`
      :'<div class="empty">现有食材凑不出能消耗短保食材的菜。看看下面「只差一样」的。</div>'}
  </div>

  <div class="cards">
    <h2 style="font-size:20px">现在就能做 <span class="muted num" style="font-family:var(--body);font-size:14px">${ok.length} 道</span></h2>
    ${ok.length?ok.map(x=>card(x,false)).join(''):'<div class="empty">还凑不出完整的一道菜。</div>'}
  </div>
  <div class="cards">
    <h2 style="font-size:20px">只差一样 <span class="muted num" style="font-family:var(--body);font-size:14px">${near.length} 道</span></h2>
    ${near.length?near.map(x=>card(x,true)).join(''):'<div class="empty">没有只差一样的菜。</div>'}
  </div>
  <div class="panel snack">
    <span class="label">能做的加餐</span>
    <div class="formula">坚果 1 小包${has('nuts')?'':'（冰箱没勾坚果）'} ＋ 任选 1 样</div>
    <div class="chips">${snacks.length?snacks.map(s=>`<span class="chip static">${esc(s.n)}</span>`).join(''):'<span class="empty">暂时没有。</span>'}</div>
  </div>`;

  v.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ing;
    if(has(id)){S.have=S.have.filter(x=>x!==id);delete S.qty[id]}else S.have=[...S.have,id];
    save();renderFridge();renderToday();
  });
  v.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc;S.qty[id]=Math.min(9,qtyOf(id)+1);save();renderFridge()});
  v.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec;S.qty[id]=Math.max(1,qtyOf(id)-1);save();renderFridge()});
  document.getElementById('hide-fire').onchange=e=>{S.hideFire=e.target.checked;save();renderFridge()};
}

/* ---------- 月菜单 ---------- */
function renderMonth(){
  const v=document.getElementById('v-month');
  const cur=dayInfo(0);const todayN=cur.before?-1:cur.n;
  const weeks=[1,2,3,4].map(w=>{
    const days=[...Array(7)].map((_,i)=>w*7-6+i);
    const cnt={g:0,y:0,r:0};days.forEach(n=>cnt[dayDish(n).t]++);
    const buys=days.filter(n=>BUY[n]).map(n=>({n,items:BUY[n]}));
    return `<div class="panel week">
      <div class="row spread"><h2>第 ${w} 周</h2><span class="meta num"><span class="dot g"></span>${cnt.g}<span class="dot y"></span>${cnt.y}<span class="dot r"></span>${cnt.r}</span></div>
      ${days.map(n=>{const d=dayDish(n);return `<details class="day ${n===todayN?'is-today':''}" ${n===todayN?'open':''}>
        <summary><span class="d num">${n===todayN?'今天':'第'+n+'天'}</span><span>${esc(d.n)}${BUY[n]?' <span class="muted" style="font-size:12px">🛒</span>':''}</span>${pill(d.t)}</summary>
        <div class="body"><div class="meta"><span>${esc(d.tool)}</span></div>${ingList(resolve(d).rows)}<div class="how">${esc(d.how)}</div></div>
      </details>`}).join('')}
      <span class="label" style="margin-top:8px">本周采购</span>
      ${buys.map(b=>`<div><div class="muted" style="font-size:13px">第 ${b.n} 天买</div><ul class="checks">${b.items.map((it,i)=>{const k=`b${b.n}-${i}`;return `<li><label><input type="checkbox" id="${k}" data-chk="${k}" ${S.checks[k]?'checked':''}><span>${esc(it)}</span></label></li>`}).join('')}</ul></div>`).join('')}
    </div>`;
  }).join('');
  const stock=Object.entries(STOCK).map(([g,items])=>`<div><div class="muted" style="font-size:13px">${esc(g)}</div><ul class="checks">${items.map((it,i)=>{const k=`s-${g}-${i}`;return `<li><label><input type="checkbox" id="${k}" data-chk="${k}" ${S.checks[k]?'checked':''}><span>${esc(it)}</span></label></li>`}).join('')}</ul></div>`).join('');
  v.innerHTML=`
  <div class="panel">
    <div class="field"><label class="label" for="start-date">第 1 天是哪天（建议选周一）</label><input type="date" id="start-date" value="${S.start}"></div>
    <span class="muted" style="font-size:13px">28 天一轮，吃完自动从第 1 周重新开始。想换顺序就整周调换，不要打散单天，因为采购是按周排的。</span>
  </div>
  <div class="panel">
    <div class="row spread"><span class="label">月初一次买齐</span><button class="btn" id="reset-checks" style="font-size:13px;padding:3px 10px">清空勾选</button></div>
    ${stock}
  </div>
  ${weeks}`;
  document.getElementById('start-date').onchange=e=>{if(e.target.value){S.start=e.target.value;save();renderToday();renderMonth()}};
  v.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{S.checks[c.dataset.chk]=c.checked;save()});
  document.getElementById('reset-checks').onclick=()=>{S.checks={};save();renderMonth()};
}

/* ---------- 路由 ---------- */
function route(){
  const tab=(location.hash||'#today').slice(1);
  const t=['today','fridge','month'].includes(tab)?tab:'today';
  ['today','fridge','month'].forEach(x=>document.getElementById('v-'+x).hidden=x!==t);
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===t?'page':'false'));
}
window.addEventListener('hashchange',route);
renderToday();renderFridge();renderMonth();route();
</script>
